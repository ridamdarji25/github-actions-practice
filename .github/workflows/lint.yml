name: Auto Linter
on:
  push: 
    paths:
      - "*.py"
jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4
      - name: Install Linter
        run: pip install ruff
      - name: Check the file for Linting
        run: ruff check .
